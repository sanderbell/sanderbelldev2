<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход · Huihui</title>
<style>body{background:#121216;color:#eee;font:16px system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{width:min(340px,80vw);padding:32px;border:1px solid #333;border-radius:20px}h1{font-size:26px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #555;background:#202026;color:white;font:inherit}button{margin-top:16px;cursor:pointer;background:#5141c2}#email-link{background:transparent;border:0;font-size:14px}#message{font-size:14px;line-height:1.5;color:#bbb}p{line-height:1.5}</style></head>
<body><main><h1>Huihui</h1><p>Личный облачный чат</p><form><div id="identity"><label for="email">Email владельца</label><input id="email" name="email" type="email" autocomplete="username"><label for="password">Пароль учётной записи</label><input id="password" name="password" type="password" autocomplete="current-password"><button id="email-link" type="button">Получить ссылку входа на почту</button></div><div id="pin-group" hidden><label for="pin">PIN Huihui</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off"></div><button id="submit" type="submit">Войти</button></form><p id="message" role="status"></p></main><script type="module" src="/hui/login.js"></script></body></html>
