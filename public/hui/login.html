<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#101013">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Huihui">
    <title>Sign in · Huihui</title>
    <link rel="stylesheet" href="/hui/login.css">
    <link rel="stylesheet" href="/hui/pwa.css">
    <link rel="manifest" href="/hui/manifest.webmanifest" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/hui/icons/apple-touch-icon.png">
  </head>
  <body>
    <main>
      <div class="brand"><span class="orb" aria-hidden="true"></span><h1>Huihui</h1></div>
      <p class="intro">Your private cloud chat.</p>
      <h2 id="step-label">Sign in to continue</h2>
      <form id="login-form" aria-describedby="message" aria-busy="true">
        <div id="identity">
          <div id="email-group"><label for="email">Owner email</label>
          <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required disabled></div>
          <label for="password">Account password</label>
          <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required disabled><button id="show-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
          <button id="email-link" class="secondary" type="button" disabled>Forgot password?</button>
        </div>
        <div id="pin-group" hidden>
          <label for="pin">Huihui PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" required disabled aria-describedby="pin-help">
          <p id="pin-help" class="field-help">Your account is verified. Enter your private chat PIN.</p>
        </div>
        <button id="submit" type="submit" disabled>Sign in</button>
        <button id="switch-account" class="secondary" type="button" hidden>Use another account</button>
      </form>
      <p id="message" role="status" aria-live="polite" aria-atomic="true">Checking account…</p>
      <p class="footnote">Access is limited to the owner's verified account.</p>
      <button class="secondary" type="button" data-pwa-install>Install Huihui</button>
    </main>
    <script type="module" src="/hui/login.js"></script>
    <script type="module" src="/hui/pwa.js"></script>
  </body>
</html>
