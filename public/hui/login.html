<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#101013">
    <title>Sign in · Huihui</title>
    <link rel="stylesheet" href="/hui/login.css">
  </head>
  <body>
    <main>
      <div class="brand"><span class="orb" aria-hidden="true"></span><h1>Huihui</h1></div>
      <p class="intro">Your private cloud chat.</p>
      <form>
        <div id="identity">
          <label for="email">Owner email</label>
          <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false">
          <label for="password">Account password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button id="email-link" class="secondary" type="button">Email a sign-in link</button>
        </div>
        <div id="pin-group" hidden>
          <label for="pin">Huihui PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off">
        </div>
        <button id="submit" type="submit">Sign in</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="footnote">Access is limited to the owner's verified account.</p>
    </main>
    <script type="module" src="/hui/login.js"></script>
  </body>
</html>
